[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-score"
version = "6.4.0"
description = "HAD damage-defense environments, rules, and cross-scale MARL experiments"
requires-python = ">=3.10"
dependencies = [
  "had-env==3.0.0a1",
]

[project.optional-dependencies]
training = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.9",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[tool.setuptools]
include-package-data = false
package-dir = {"open_score" = "."}
packages = [
  "open_score",
  "open_score.envs",
  "open_score.algos",
  "open_score.algos.common",
  "open_score.algos.common.pymarl",
  "open_score.algos.common.pymarl.components",
  "open_score.algos.common.pymarl.controllers",
  "open_score.algos.common.pymarl.learners",
  "open_score.algos.common.pymarl.modules",
  "open_score.algos.common.pymarl.modules.agents",
  "open_score.algos.common.pymarl.modules.layers",
  "open_score.algos.common.pymarl.modules.mixers",
  "open_score.algos.common.pymarl.runners",
  "open_score.algos.common.pymarl.utils",
  "open_score.algos.dcg",
  "open_score.algos.rules",
  "open_score.algos.spectra",
  "open_score.algos.transfqmix",
  "open_score.utils",
  "open_score.utils.eval",
]

[tool.setuptools.package-data]
"open_score" = ["configs/*.yaml"]
"open_score.algos.common.pymarl" = ["LICENSE", "README.md", "config/default.yaml"]
"open_score.algos.dcg" = ["LICENSE"]
