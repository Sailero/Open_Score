seed: 0
study: open_population_adversarial_allocation

environment:
  name: open_swarm_battle
  train_team_sizes: [[4, 4], [6, 6]]
  upper_action_interval: 5
  allow_attrition: true
  allow_reinforcement: true
  task_types: [attack, intercept, defend]

lower_executor:
  checkpoint: null
  frozen: true
  shared_across_upper_methods: true

upper_allocator:
  encoder: set_attention
  assignment_head: pointer
  hidden_dim: 128
  algorithm: mappo

opponent_pool:
  enabled: true
  max_snapshots: 8
  latest_probability: 0.25
  hard_opponent_weight: 0.5
  temperature: 1.0

evaluation:
  train_seeds: 5
  episodes_per_matchup: 200
  held_out_team_sizes: [[3, 5], [5, 8], [8, 8], [8, 12]]
  empirical_best_response_steps: 1000000
