[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "had-env"
version = "1.0.0"
description = "Standalone heterogeneous attack-defense simulation with simultaneous multi-agent APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11.4,<2",
  "gymnasium>=1.0,<2",
  "pettingzoo>=1.24,<2",
]

[project.optional-dependencies]
render = ["pygame>=2.5,<3"]
viewer = [
  "pygame>=2.5,<3",
  "PySide6>=6.8,<7",
  "matplotlib>=3.7,<4",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.5",
]
test = ["pytest>=8.4,<9"]

[project.scripts]
had-workbench = "had_env.workbench.cli:main"

[tool.setuptools]
py-modules = ["make_env"]

[tool.setuptools.packages.find]
where = ["."]
include = ["had_env*"]

[tool.setuptools.package-data]
"had_env.core" = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
