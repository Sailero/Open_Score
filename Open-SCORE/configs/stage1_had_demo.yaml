experiment: stage1_had_variable_qmix_demo
seed: 20260828
device: auto

environment:
  name: had_stage1
  sides: [Red, Blue]
  scale_range: [1, 2, 3, 4]
  targets: 1
  target_region:
    x: [-2300.0, -1900.0]
    y: [-1200.0, 1200.0]
    z: [50.0, 300.0]
  registered_train_cases: red_gt_blue_all_1_to_4
  registered_scales: [2v1, 3v1, 3v2, 4v1, 4v2, 4v3]
  invalid_cases: red_le_blue_rejected_at_construction
  max_steps: 300
  action_primitives: 27

model:
  entity_dim: 12
  self_dim: 10
  task_dim: 6
  state_entity_dim: 11
  action_dim: 27
  agent_hidden_dim: 64
  mixer_hidden_dim: 32
  mixing_dim: 16

training:
  gamma: 0.99
  learning_rate: 0.0005
  batch_episodes: 16
  replay_episodes: 2000
  burn_in: 8
  sequence_length: 32
  target_update_interval: 200
  epsilon_start: 1.0
  epsilon_finish: 0.05
  epsilon_anneal_steps: 100000
  curriculum:
    unlock_order: [2v1, 3v1_3v2, 4v1_4v2_4v3]
    episodes_per_stage: 2000
    sampler: td_learning_progress
    uniform_coverage: 0.20
  warm_start_environment_steps_per_side: 300000

psro:
  enabled_after_warm_start: true
  max_iterations: 8
  payoff_episodes_per_cell: 100
  best_response_environment_steps: 300000
  nash_conv_tolerance: 0.10
  convergence_patience: 3
  meta_value_tolerance: 0.03
  archive_win_rate_is_diagnostic_only: true

demo_gate:
  seeds: 3
  minimum_balanced_scale_win_rate: 0.55
  maximum_interpolation_drop: 0.15
  maximum_estimated_nash_conv: 0.10
