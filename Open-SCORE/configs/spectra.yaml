# SPECTra GRF ffababf6187216c9d16b2109ee8ef6fe5fdf1172 spectra_qmix_plus.yaml.
name: spectra
mac: spectra_mac
learner: nq_learner
mixer: spectra_mixer
runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
# See dcg.yaml: updates per environment step are a shared experimental control.
# The optimizer, learning rate and TD(lambda) target stay at SPECTra's own
# values, since those are part of the method rather than of the budget.
training_iters: 8
target_update_interval: 200
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
hidden_size: 64
rnn_hidden_dim: 64
n_head: 4
attn_n_heads: 4
mixing_n_head: 4
hypernet_embed: 32
mixing_embed_dim: 32
lr: 0.001
gamma: 0.99
td_lambda: 0.6
optimizer: adam
q_lambda: false
n_reward: 1
use_SAQA: true
entity_last_action: false
obs_agent_id: false
obs_last_action: false
popart: false
max_traj_len: -1
t_max: 0
agent:
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: null

