schema_version: open-score-stage3-saldae-do-v1
seed: 20260904
device: cuda
output_dir: outputs/mvp/stage3_saldae_do_v1

artifacts:
  stage1_checkpoint: outputs/round_01_mvp/stage1/checkpoints/refil_qmix_seed20260831_best.pt
  stage1_sha256: AUTO
  stage2_checkpoint: outputs/mvp/stage23_identity_blotto_v5/stage2/model/dynamic_outcome_time_model.pt
  stage2_sha256: AUTO
  stage2_dataset: outputs/mvp/stage23_identity_blotto_v5/stage2/data/dynamic_outcome_time.jsonl
  stage2_dataset_sha256: AUTO

method:
  model: identity_coalition_structured_zero_sum_blotto
  model_changed_from_v5: false
  previous_oracle: spatial_candidate_set_partitioning_milp
  proposed_oracle: saldae_anytime_csg_search
  outer_solver: double_oracle
  implementation: milp_warm_started_saldae_do
  original_saldae_components:
    - coalition_structure_graph
    - split_and_merge_edges
    - multiple_search_agents
    - OPEN_RESERVE_SUBSTITUTE_memory
    - value_guided_child_selection
    - bridging_path
    - anytime_incumbent
  task_specific_extensions:
    - target_and_channel_labels
    - hard_1_to_4_group_cap
    - identity_swap_and_relocation_edges
    - red_reserve_transitions
    - expected_value_against_opponent_mixture
    - double_oracle_zero_sum_outer_loop
    - affine_shifted_omega_threshold_for_signed_payoffs
  claims_exact_saldae_reference_implementation: false
  claims_global_nash_certificate: false

game:
  group_size_support: [1, 2, 3, 4]
  fixed_targets_per_episode: true
  repeated_target_groups: true
  red_reserve_enabled: true
  blue_reserve_enabled: false
  local_utility: joint_survival_log_probability
  risk_epsilon: 0.000001

candidate_domain:
  complete_domain_max_agents_per_side: 8
  spatial_neighborhood_size: 6
  peer_count: 3
  baseline_scope: registered_spatial_columns
  saldae_scope: on_demand_all_identity_coalitions_up_to_size_four

milp_solver:
  tolerance: 0.01
  max_iterations: 12
  oracle_time_limit_seconds: 1.0
  oracle_mip_relative_gap: 0.01
  payoff_batch_size: 1024

saldae_solver:
  tolerance: 0.01
  max_iterations: 6
  search_agents: 4
  time_limit_seconds_per_best_response: 0.35
  max_expansions: 80
  keep_children_multiplier: 2.0
  child_sample_multiplier: 4.0
  selection_rounds: 2
  omega: 0.995
  reserve_memory: 512
  bridge_path_limit: 16
  warm_start: candidate_milp_equilibrium_support

solver_evaluation:
  exact_small_game:
    red: 3
    blue: 3
    targets: 2
    scenarios: 10
  planner_benchmarks:
    - {label: "30", red: 18, blue: 12, targets: 2, repeats: 3}
    - {label: "40", red: 24, blue: 16, targets: 4, repeats: 3}
    - {label: "50", red: 30, blue: 20, targets: 5, repeats: 3}

physical_evaluation:
  enabled: true
  max_steps: 50
  smoke_max_steps: 12
  command_interval: 5
  replan_on_casualty: true
  blue_split_spacing: 180.0
  reserve_patrol:
    standoff_distance: 350.0
    lateral_spacing: 90.0
    distance_scale: 1000.0
  episodes_per_cell: 5
  progress_every_episodes: 2
  scenarios:
    - {label: had30_fixed_t2, red: 18, blue: 12, targets: 2, layout: moderate_jittered}
    - {label: had40_fixed_t4, red: 24, blue: 16, targets: 4, layout: moderate_jittered}
    - {label: had50_fixed_t5, red: 30, blue: 20, targets: 5, layout: moderate_jittered}
  layout_generator:
    x_center: -2100.0
    z: 100.0
    target_y_spacing: 650.0
    target_y_jitter: 50.0
  matchups:
    - milp_do
    - saldae_do
  blue_lower_styles: [rush, split_rush]

acceptance:
  small_game_value_error_max: 0.05
  require_all_groups_at_most_four: true
  require_fixed_target_count: true
  require_red_active_or_reserve_partition_exact: true
  require_blue_partition_exact: true
  require_no_false_global_certificate: true
  planning_p95_seconds:
    "30": 15.0
    "40": 20.0
    "50": 30.0

comparison:
  direct_baseline: same_state_same_stage2_spatial_candidate_milp_do
  previous_formal_summary: outputs/mvp/stage23_identity_blotto_v5/stage3/analysis/summary.json
  primary_claim_rule: improvement_requires_measured_proxy_or_physical_gain
