# ALMA probe knives 1+2+3: Blue subtasks, full-field low-level, and an
# event clock. The upper layer re-allocates on death, a stable public
# nearest-target change, or a 10-step hold; the allocation TD uses a
# discounted SMDP segment and γ^τ bootstrap.
runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
training_iters: 8
target_update_interval: 200
alloc_target_update_interval: 50
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
lr: 0.0005
gamma: 0.99
rnn_hidden_dim: 64
encoder_chunk_size: 1024
encoder_skip_dead: true
attn_embed_dim: 128
attn_n_heads: 4
alloc_embed_dim: 128
alloc_n_heads: 4
mixing_embed_dim: 32
mixer_chunk_size: 256
mixer_skip_unfilled: true
hypernet_embed: 128
softmax_mixing_weights: true
obs_agent_id: false
obs_last_action: false
popart: false
max_traj_len: -1
t_max: 0
name: alma_event
mac: entity_mac
learner: q_learner
mixer: flex_qmix
encoder: attention
entity_last_action: true
n_extra_tasks: 30
mixer_subtask_cond: off
agent:
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: full_obs
hier_agent:
  task_allocation: aql
  smdp_alloc: true
  action_length: 10
env_args:
  subtask_set: blues
  allocation_clock: event
  action_length: 10
  max_alloc_hold: 10
