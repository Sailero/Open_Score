# One-layer GCN encoder adapted from SPECTra ffababf6187216c9d16b2109ee8ef6fe5fdf1172.
# This is GNN-QMIX on the shared ALMA learner, not an InforMARL reproduction.
runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
training_iters: 8
target_update_interval: 200
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
lr: 0.0005
gamma: 0.99
rnn_hidden_dim: 64
encoder_chunk_size: 1024
encoder_skip_dead: true
attn_embed_dim: 128
attn_n_heads: 4
mixing_embed_dim: 32
mixer_chunk_size: 256
mixer_skip_unfilled: true
hypernet_embed: 128
softmax_mixing_weights: true
obs_agent_id: false
obs_last_action: false
popart: false
max_traj_len: -1
t_max: 0
name: gnn_qmix
mac: entity_mac
learner: q_learner
mixer: flex_qmix
encoder: gnn
entity_last_action: false
gnn_layer_num: 1
gnn_edges: full
gnn_k: 10
agent:
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: null

