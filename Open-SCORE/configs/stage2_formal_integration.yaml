# Fast end-to-end protocol regression; synthetic rows are not environment evidence.
seed: 31
device: cpu
output_dir: outputs/stage2_formal_integration
minimum_continuations_per_cell: 2
data:
  source: synthetic
  n_roots: 20
  scales: [[2, 1], [3, 1], [3, 2], [4, 2], [4, 3]]
  defender_policies: [guard, adaptive]
  attacker_policies: [rush, split_rush]
  replicates_per_candidate: 2
  horizon_steps: 40
  command_steps: 10
  seed: 31
split:
  train_fraction: 0.50
  validation_fraction: 0.15
  temperature_calibration_fraction: 0.10
  risk_calibration_fraction: 0.10
training:
  model_kind: had_deepset
  horizon_bins: 8
  steps_per_bin: 5
  hidden_dim: 24
  ensemble_members: 2
  epochs: 4
  minimum_epochs: 1
  early_stopping_patience: 2
  batch_size: 64
  policy_unknown_augmentation_probability: 0.20
  physical_loss_weight: 0.50
evaluation:
  bootstrap_samples: 20
  bootstrap_seed: 93
tabular_baseline:
  enabled: true
  max_iter_candidates: [5, 10]
  max_leaf_nodes: 7
