# Stage-2 integration smoke on actual HAD forward rollouts from rule policies.
# This budget validates data/model/calibration plumbing; it is not convergence evidence.
seed: 20260830
device: auto
output_dir: outputs/stage2_had_smoke
published_metrics_path: docs/results/stage2_had_smoke_metrics.json
published_dataset_path: docs/evidence/stage2_had_forward_rollout_pilot.jsonl

data:
  source: had
  scales:
    - [2, 1]
    - [3, 1]
    - [3, 2]
    - [4, 1]
    - [4, 2]
    - [4, 3]
  # Disjoint master seeds prevent the same target/layout parent from appearing
  # under another scale in a different data partition.
  seeds_by_scale:
    2v1: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012]
    3v1: [1101, 1102, 1103, 1104, 1105, 1106, 1107, 1108, 1109, 1110, 1111, 1112]
    3v2: [1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208, 1209, 1210, 1211, 1212]
    4v1: [1301, 1302, 1303, 1304, 1305, 1306, 1307, 1308, 1309, 1310, 1311, 1312]
    4v2: [1401, 1402, 1403, 1404, 1405, 1406, 1407, 1408, 1409, 1410, 1411, 1412]
    4v3: [1501, 1502, 1503, 1504, 1505, 1506, 1507, 1508, 1509, 1510, 1511, 1512]
  defender_policies: [guard, intercept]
  attacker_policies: [rush, split_rush]
  max_steps: 80
  command_steps: 30
  capability_version: had-stage1-rules-v1
  policy_version: rule-v1

split:
  train_fraction: 0.50
  temperature_calibration_fraction: 0.1666666667
  risk_calibration_fraction: 0.1666666667
  stratify_by_scenario: true

training:
  horizon_bins: 8
  steps_per_bin: 10
  hidden_dim: 64
  ensemble_members: 5
  epochs: 80
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  gradient_clip: 5.0
  calibration_alpha: 0.10
  include_policy_context: true
  policy_unknown_augmentation_probability: 0.20
