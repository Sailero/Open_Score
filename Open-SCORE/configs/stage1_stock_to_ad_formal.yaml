experiment: stage1_smaclite_stock_to_ad_finetuning
protocol_version: stock-to-ad-transfer-v3-saqa-strict-potential

architecture:
  primary_name: OpenSCORE-SAQA-QMIX-SP
  encoder_kind: saqa
  attention_heads: 4
  implementation_origin: original_Open-SCORE_PyTorch
  exact_REFIL_or_SPECTra_reproduction: false
  code_copied_from_SPECTra: false
  inspiration:
    REFIL_Attention_QMIX: https://proceedings.mlr.press/v139/iqbal21a.html
    SPECTra_paper: https://arxiv.org/abs/2503.11726
    SPECTra_repository: https://github.com/funny-rl/SPECTra
    SPECTra_audited_commit: ffababf6187216c9d16b2109ee8ef6fe5fdf1172
    SPMARL_learning_progress: https://proceedings.mlr.press/v267/zhao25o.html

official_stock_reproduction:
  implementation: EPyMARL
  algorithm_map_pairs:
    qmix: smaclite/2s_vs_1sc-v0
    vdn: smaclite/3s5z-v0
    mappo: smaclite/MMM2-v0
  purpose: benchmark_standard_performance_only
  note: EPyMARL checkpoints are not silently loaded into the Open-SCORE entity model

same_architecture_stock_pretraining:
  implementation: scripts/train_smaclite_stock_entity_baselines.py
  environment: smaclite/3s5z-v0
  map_files_modified: false
  algorithms: [qmix, vdn, mappo]
  seeds: [20260830, 20260831, 20260832, 20260833, 20260834]
  episode_limit: 150
  episodes: 2000
  batch_episodes: 8
  replay_episodes: 512
  updates_per_episode: 1
  eval_every: 100
  validation_episodes: 32
  heldout_episodes: 64
  formal_evidence: true
  minimum_source_seeds: 5
  minimum_source_win_rate: 0.20
  agent_hidden_dim: 128
  critic_hidden_dim: 128
  encoder_kind: saqa
  attention_heads: 4
  learning_rate: 0.0005
  target_update_interval: 200
  td_lambda: 0.6
  ppo_epochs: 4
  epsilon_start: 0.9
  epsilon_finish: 0.05
  epsilon_anneal_steps: 100000
  use_cpp_rvo2: true
  checkpoint_selection: validation_best_after_at_least_one_gradient_update
  checkpoint_selection_metric: [win_rate, mean_return]
  heldout_used_for_selection: false
  official_reproduction_claim: false

ad_environment_audit:
  implementation: scripts/audit_smaclite_ad_protocol.py
  ratios: [2v1, 3v2, 5v3]
  episodes_per_ratio: 60
  mapping_episodes_per_ratio: 5
  layout_seeds: 50
  episode_limit: 150
  max_red_agents: 6
  max_blue_agents: 5
  spawn_jitter: 2.0
  reward_mode: strict_potential
  gamma: 0.99
  shaping_scale: 0.5
  approach_weight: 1.0
  seed: 20260831
  use_cpp_rvo2: true
  output: outputs/smaclite_ad_audit/protocol_audit.json
  source_integrity:
    manifest: configs/stock_reproduction/smaclite_aamas2023_epymarl_v3.json
    smaclite_checkout_commit_exact: true
    smaclite_checkout_tracked_clean: true
    runtime_smaclite_from_expected_checkout: true
    stock_map_file_count: 13
    stock_map_combined_hash_algorithm: sorted_filename_nul_raw_bytes_lf_sha256
    stock_map_combined_sha256: 77508021d516a9ed8a8e520a32570bea68803c3a4ffdbf57266b05f1be65d310
    rvo2_binary_sha256: 634b060ef5cbf0dd0561d19c2317ff45bc4e71b9a6ab54b9fd4677a415da034c
    require_before_after_identity: true
  pytest_contract:
    executed_by_this_audit: false
    execution_claim: required_external_P0_gate_not_fabricated_by_audit
    required_nodes:
      - tests/test_smaclite_ad.py::test_ad_dynamic_rosters_share_shapes_and_masks
      - tests/test_smaclite_ad.py::test_asset_objective_and_stock_fingerprint_are_isolated
      - tests/test_smaclite_ad.py::test_strict_potential_discounted_return_telescopes_to_terminal_payoff
      - tests/test_entity_action_equivariance.py
  acceptance:
    rush_asset_vs_idle_win_rate_ge: 0.90
    rush_asset_vs_intercept_win_rate_le: 0.10
    clear_then_asset_vs_intercept_each_ratio_ge: 0.90
    random_vs_intercept_win_rate_le: 0.10
    all_layouts_legal: true
    randomized_layouts_unique: true
    required_unique_layouts_per_ratio: 50
    available_target_mapping_exact: true
    mapping_errors_eq: 0
    stock_checkout_maps_and_rvo2_unchanged_before_after: true

transfer:
  implementation: src/open_score/stage1/transfer.py
  exact_name_and_shape_required: true
  safe_latent_layer_allowlist: true
  excluded:
    - raw_feature_projections
    - fixed_action_rows
    - target_type_embedding_rows_0_2_3
    - optimizer
    - target_network
  target_type_embedding_transfer:
    copied_rows: {1: enemy_damage}
    fresh_destination_rows:
      0: non_target
      2: ally_heal
      3: protected_asset
    rationale: only_enemy_damage_has_identical_stock_and_ad_action_semantics
  audit:
    - source_checkpoint_sha256
    - per_tensor_sha256_before_source_after
    - changed_copied_tensor_count
    - copied_source_trained_tensor_count
    - copied_parameter_fraction
    - source_selected_checkpoint_learner_updates
    - source_total_training_learner_updates
    - exact_encoder_kind_and_attention_heads

ad_finetuning:
  implementation: scripts/train_smaclite_ad_baselines.py
  environment: OpenSCORE/SMACliteAD-Asset-v0
  train_side: Red
  initializations: [scratch, stock_transfer]
  paired_random_initial_draw: true
  paired_training_and_evaluation_layout_seeds: true
  ratios: [2v1, 3v2, 5v3]
  seeds: [20260830, 20260831, 20260832, 20260833, 20260834]
  checkpoint_selection: validation_best
  checkpoint_selection_metric: lexicographic_worst_ratio_then_overall_mean
  heldout_used_once_after_selection: true
  target_opponent: intercept
  target_opponent_information_scope: privileged_full_environment_state
  target_opponent_report_label: privileged_full_state_threat
  solvability_rule: clear_then_asset
  naive_lower_bound_rule: rush_asset
  warmup_opponent: idle
  warmup_fraction: 0.25
  clear_replay_on_opponent_transition: true
  mappo_pending_transition: flush_idle_pending_before_first_target_rollout
  validation_and_heldout_use_target_opponent_only: true
  scale_balanced_replay: true
  episodes: 2000
  episode_limit: 150
  batch_episodes: 12
  replay_episodes: 1024
  updates_per_episode: 1
  eval_every: 100
  validation_episodes_per_ratio: 20
  heldout_episodes_per_ratio: 40
  max_red_agents: 6
  max_blue_agents: 5
  agent_hidden_dim: 128
  critic_hidden_dim: 128
  encoder_kind: saqa
  attention_heads: 4
  reward_mode: strict_potential
  gamma: 0.99
  shaping_scale: 0.5
  approach_weight: 1.0
  spawn_jitter: 2.0
  use_cpp_rvo2: true
  backend_mixed_within_comparison: false
  reused_stock_hyperparameters:
    learning_rate: 0.0005
    target_update_interval: 200
    td_lambda: 0.6
    ppo_epochs: 4
    epsilon_start: 0.9
    epsilon_finish: 0.05
    epsilon_anneal_steps: 100000

acceptance_gates:
  stock_source:
    parameters_changed: true
    learner_updates_gt: 0
    heldout_win_rate_each_seed_ge: 0.20
    minimum_training_seeds: 5
    aggregate_gate_must_be_embedded_in_checkpoint: true
  transfer_integrity:
    changed_copied_tensor_count_gt: 0
    same_random_initial_draw: true
  ad_task_per_algorithm:
    minimum_training_seeds: 5
    heldout_win_rate_mean_ge: 0.80
    every_ratio_win_rate_mean_ge: 0.70
  transfer_benefit_separate_hypothesis:
    transfer_minus_scratch_seed_bootstrap_ci95_low_gt: 0.0
    does_not_invalidate_task_success_at_ceiling: true
  convergence:
    plateau_window_evaluations: 5
    max_absolute_win_rate_slope_per_evaluation: 0.02
    max_win_rate_range: 0.10
    task_claim_requires_task_integrity_and_stability_gates: true
    transfer_benefit_is_a_separate_claim: true

artifacts:
  stock_source_directory: outputs/smaclite_stock_entity_formal
  stock_validation_best_checkpoint: "outputs/smaclite_stock_entity_formal/{algorithm}_seed{seed}.pt"
  stock_final_checkpoint: "outputs/smaclite_stock_entity_formal/{algorithm}_seed{seed}_final.pt"
  ad_output_directory: outputs/smaclite_ad_formal
  ad_validation_best_checkpoint: "outputs/smaclite_ad_formal/checkpoints/{algorithm}_{initialization}_seed{seed}_validation_best.pt"
  ad_final_checkpoint: "outputs/smaclite_ad_formal/checkpoints/{algorithm}_{initialization}_seed{seed}_final.pt"
  ad_summary: outputs/smaclite_ad_formal/evidence/smaclite_ad_baselines_summary.json
  ad_curves: outputs/smaclite_ad_formal/evidence/smaclite_ad_baselines_curve.csv
  curation_policy: copy_only_final_summary_curves_and_selected_figures_after_all_formal_runs
  legacy_pre_time_context_artifacts_eligible: false
