# One-shot formal HAD collection. The output is immutable input to stage2_had_formal.yaml.
seed: 20260831
formal_collection: true
minimum_continuations_per_cell: 32
output: outputs/stage2_had_formal_frozen/dataset.jsonl

data:
  source: had
  # JSONL is streamed in one pass. A second CSV copy would roughly double disk
  # and force materialisation, so it is intentionally disabled for formal data.
  write_csv: false
  scales: [[2, 1], [3, 1], [3, 2], [4, 1], [4, 2], [4, 3]]
  # 140 independent master lineages -> 63/21/14/21/21 under the frozen split.
  seed_range: {start: 21001, count: 140}
  snapshot_steps: [0, 10, 20]
  rollout_horizon_steps: 30
  prefix_defender_policy: guard
  prefix_attacker_policy: rush
  defender_candidates:
    - {kind: rule, style: guard, policy_id: rule:guard, version: rule-v1}
    - {kind: rule, style: intercept, policy_id: rule:intercept, version: rule-v1}
    - kind: checkpoint
      algorithm: qmix
      # Replace with deployment_candidate.checkpoint from the completed Stage-1
      # aggregate; do not copy/rename the checkpoint for Stage 2.
      path: REPLACE_WITH_STAGE1_QMIX_VALIDATION_BEST_CHECKPOINT_PATH.pt
      expected_sha256: REPLACE_WITH_64_HEX_STAGE1_CHECKPOINT_SHA256
      policy_id: stage1:qmix
  attacker_threats:
    - {kind: rule, style: rush, policy_id: threat:rush, version: noisy-rule-v1, action_noise: 0.05}
    - {kind: rule, style: split_rush, policy_id: threat:split_rush, version: noisy-rule-v1, action_noise: 0.05}
  continuations_per_cell: 32
  max_steps: 50
  command_steps: 20
  shaping_scale: 0.5
  capability_version: had-stage1-formal-v5-hybrid-preservation
  strict_checkpoint_contract: true
