experiment: stage1_had_rule_qmix_vdn_mappo
protocol_version: stage1-had-reproduction-v5-hybrid-preservation
research_references:
  REFIL: https://proceedings.mlr.press/v139/iqbal21a.html
  SPECTra_paper: https://arxiv.org/abs/2503.11726
  SPECTra_repository: https://github.com/funny-rl/SPECTra
  SPECTra_audited_commit: ffababf6187216c9d16b2109ee8ef6fe5fdf1172
  EPC: https://openreview.net/forum?id=SJxbHkrKDH
  SPMARL: https://proceedings.mlr.press/v267/zhao25o.html
seed_policy:
  formal: [20260830, 20260831, 20260832, 20260833, 20260834]

environment:
  name: HADStage1Adapter
  roles: {Red: asset_defender, Blue: asset_attacker}
  firing_semantics: attack_agent_self_destructs_after_firing
  strict_constraint: red_agents_gt_blue_agents
  registered_scales: [2v1, 3v1, 3v2, 4v1, 4v2, 4v3]
  rejected_scales: red_agents_le_blue_agents
  targets: 1
  max_steps: 50
  tensor_contract:
    entity_dim: 12
    self_dim: 10
    task_dim: 7
    state_entity_dim: 12
    action_dim: 27
  action_space: 27_quantized_acceleration_primitives
  markov_time_context:
    actor_task_feature: normalized_remaining_horizon
    centralized_state_feature: normalized_remaining_horizon_repeated_per_real_entity
  reward:
    terminal_outcome: plus_or_minus_one
    gamma: 0.99
    potential_shaping_scale: 0.5
    terminal_potential_is_zero: true
    clearance_weight: 0.5
    intercept_weight: 0.25

strategies:
  rule:
    Red: guard
    Blue: rush
  intelligent:
    name: OpenSCORE-SAQA-QMIX-SP
    primary_algorithm: qmix
    training_regime: hybrid_rule_demonstration_pretraining_plus_RL_finetuning
    encoder_kind: saqa
    attention_heads: 4
    implementation_origin: original_Open-SCORE_PyTorch
    exact_REFIL_or_SPECTra_reproduction: false
    SPECTra_code_copied: false
    shared_across_all_registered_scales: true
    entity_and_agent_masks: true
    parameter_sharing: true
    curriculum:
      unlock: [2v1, 3v1_3v2, 4v1_4v2_4v3]
      sampler: fast_slow_learning_signal_progress
      uniform_coverage: 0.20
    research_basis:
      - REFIL_variable_entity_multitask_motivation
      - EPC_stagewise_population_schedule
      - SPMARL_TD_error_learning_progress
      - SPECTra_SAQA_and_target_action_design_inspiration
    exact_reimplementation_claim: false
    demonstration_pretraining:
      enabled: true
      algorithms: [qmix]
      teacher: guard
      teacher_information_scope: privileged_current_HAD_engine_full_state_non_oracle
      teacher_is_performance_upper_bound: false
      split: train_only
      balance: equal_episodes_per_scale_by_opponent_cell
      opponents: [rush, split_rush]
      seed_offset: 28000000
      training_seed_stride: 100000000
      validation_and_heldout_seed_overlap_allowed: false

baselines:
  common_observation_contract: true
  common_action_contract: true
  algorithms: [vdn, mappo]
  opponent_suite: [rush, split_rush]
  train_side: Red

executed_algorithms: [qmix, vdn, mappo]

budgets:
  engineering_precheck:
    purpose: fixed_2v1_gradient_checkpoint_and_reload_check_only
    scale: 2v1
    algorithms: [qmix, vdn, mappo]
    train_side: Red
    opponent_styles: [rush, split_rush]
    seeds: [20260830]
    episodes: 72
    batch_episodes: 4
    replay_episodes: 256
    updates_per_episode: 1
    target_update_interval: 200
    ppo_epochs: 3
    learning_rate: 0.0005
    shaping_scale: 0.5
    eval_every: 12
    eval_episodes_per_scale: 2
    heldout_episodes_per_scale: 8
    max_steps: 50
    episodes_per_stage: 12
    epsilon_anneal_steps: 2000
    agent_hidden_dim: 64
    critic_hidden_dim: 64
    encoder_kind: saqa
    attention_heads: 4
    bc_demo_episodes_per_scale_opponent: 0
    device: cuda
    output_dir: outputs/stage1_had_2v1_precheck
    evidence_dir: outputs/stage1_had_2v1_precheck/evidence
    evidence_prefix: fixed_2v1_precheck
    acceptance:
      required_algorithms: [qmix, vdn, mappo]
      learner_updates_gt_zero: true
      selected_parameters_changed: true
      critical_learner_metrics_finite: true
      selected_and_final_parameters_finite: true
      best_checkpoint_disk_strict_reload: true
      final_checkpoint_saved_and_hashed: true
      final_checkpoint_disk_reload_required: false
      performance_threshold: null
    convergence_claim: false
  formal_minimum:
    seeds: 5
    episodes: 2000
    batch_episodes: 12
    replay_episodes: 1024
    updates_per_episode: 1
    target_update_interval: 200
    ppo_epochs: 4
    learning_rate: 0.0005
    eval_every: 100
    eval_episodes_per_scale: 4
    heldout_episodes_per_scale_per_opponent: 20
    episodes_per_stage: 100
    epsilon_anneal_steps: 50000
    epsilon_start: 1.0
    epsilon_finish: 0.05
    agent_hidden_dim: 128
    critic_hidden_dim: 128
    encoder_kind: saqa
    attention_heads: 4
    bc_demo_episodes_per_scale_opponent: 16
    bc_epochs: 8
    bc_batch_episodes: 12
    bc_learning_rate: 0.001
    hybrid_preservation:
      rationale: avoid_catastrophic_forgetting_after_rule_demonstration_BC
      rl_learning_rate: 0.0001
      epsilon_start: 0.20
      epsilon_finish: 0.02
      epsilon_anneal_steps: 50000
      minimum_rl_updates_for_checkpoint_selection: 100
      interleaved_demo_rehearsal: false
    checkpoint_selection_split: validation
    checkpoint_selection_metric: lexicographic_worst_scale_by_opponent_then_overall_mean
    heldout_evaluations_after_selection: 1
    report_confidence_intervals: true
    budget_selected_from_learning_curve_plateau: false
    budget_preregistered_before_formal_run: true
    held_out_evaluation_seeds: true
    convergence_claim_only_after_plateau_and_stability: true
    baseline_replication_gate:
      algorithms: [vdn, mappo]
      every_selected_checkpoint_trained: true
      validation_payoff_improvement_mean_gt: 0.0
      plateau_stability_required: true
    primary_strategy_gate:
      algorithm: qmix
      rule_reference: guard
      seed_bootstrap_delta_ci95_low_gt: 0.0
      every_scale_mean_delta_ge: 0.0

artifacts:
  runtime_output: outputs/stage1_had_formal
  validation_best_checkpoint: "outputs/stage1_had_formal/checkpoints/{algorithm}_seed{seed}_best.pt"
  final_checkpoint: "outputs/stage1_had_formal/checkpoints/{algorithm}_seed{seed}.pt"
  runtime_summary: outputs/stage1_had_formal/evidence/stage1_had_formal_summary.json
  runtime_curves: outputs/stage1_had_formal/evidence/stage1_had_formal_training_curves.csv
  curation_policy: copy_only_final_summary_curves_and_selected_figures_after_all_formal_runs
  legacy_pre_time_context_artifacts_eligible: false
