schema_version: open-score-stage2-identity-local-value-v4
seed: 20260904
device: cuda
output_dir: outputs/stage123_unknown_upper_v1/stage3/baselines/stage2_reproduction
stage1_checkpoint: outputs/stage123_unknown_upper_v1/stage1/checkpoints/refil_qmix_seed20260831_best.pt

# One record now represents one actual local group pair. It is never first
# collapsed into a target total and then split by a Stage3 heuristic.
execution_semantics:
  red_executor: frozen_round01_refil_qmix_single_group
  blue_executor: assignment_conditioned_known_rule
  local_group_semantics: one_target_one_group_pair
  trajectory_snapshots: current_alive_roster_replanned_continuation
  controller_reset_on_roster_change: true
  controller_reset_at_every_saved_command_event: true
  freshly_regrouped_counterfactuals: false
  target_count: 1
  target_position: [-2100.0, 0.0, 100.0]
  exact_empty_side_boundaries: true

# Stage3 may form several identity-labelled groups at one target, but every
# local group is hard capped at 4v4.  All 16 non-empty roster cells are
# independently initialized and directly sampled.
supported_roster:
  min_red: 1
  max_red: 4
  min_blue: 1
  max_blue: 4
  primary_max_red: 4
  primary_max_blue: 4

shape_calibration:
  method: alternating_logit_concave_isotonic_v1
  max_iterations: 50
  tolerance: 0.0000001

collection:
  opponents: [rush, split_rush]
  max_steps: 50
  snapshot_steps: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45]
  snapshot_on_alive_count_change: true
  seed_base: 64000000
  blue_split_spacing: 180.0
  progress_every_episodes: 50
  checkpoint_every_episodes: 10

  # 16 cells x 2 Blue styles x 600 = 19,200 independent episodes.
  core_scales:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [1, 4]
    - [2, 1]
    - [2, 2]
    - [2, 3]
    - [2, 4]
    - [3, 1]
    - [3, 2]
    - [3, 3]
    - [3, 4]
    - [4, 1]
    - [4, 2]
    - [4, 3]
    - [4, 4]
  core_episodes_per_cell: 600
  core_training_weight: 1.0

  sparse_scales: []
  sparse_episodes_per_cell: 0
  sparse_training_weight: 0.0

  heldout_scales: []
  heldout_episodes_per_cell: 0

  split:
    train_fraction: 0.65
    validation_fraction: 0.10
    calibration_fraction: 0.10

training:
  seed: 20260904
  horizon_bins: 10
  steps_per_bin: 5
  entity_hidden_dim: 64
  hidden_dim: 128
  batch_size: 384
  learning_rate: 0.0008
  weight_decay: 0.00001
  max_epochs: 160
  minimum_epochs: 30
  patience: 25
  gradient_clip: 5.0
  outcome_bce_weight: 0.75
  time_huber_weight: 0.35
  selection_time_weight: 0.15
  selection_nll_weight: 0.05
  monotonicity_weight: 0.30
  diminishing_marginal_weight: 0.08
  style_minimum_cell_mass: 8.0
  style_global_prior_strength: 2.0
  style_cell_prior_strength: 8.0

acceptance:
  core_brier_max: 0.17
  core_auc_min: 0.70
  core_time_mae_max_steps: 10.0
  core_mean_scale_win_rate_error_max: 0.12
  core_ece_max: 0.08
  monotonic_violation_rate_max: 0.02
  diminishing_violation_rate_max: 0.15
  shape_projection_mae_max: 0.08
