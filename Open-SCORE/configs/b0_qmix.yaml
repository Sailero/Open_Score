# B0, ordinary ordered QMIX baseline; shared ALMA training schedule.
runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
training_iters: 8
target_update_interval: 200
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
lr: 0.0005
gamma: 0.99
rnn_hidden_dim: 64
encoder_chunk_size: 1024
encoder_skip_dead: true
attn_embed_dim: 128
attn_n_heads: 4
mixing_embed_dim: 32
hypernet_embed: 128
# Reference PyMARL QMIX depth; hypernet_embed only exists for the two-layer
# hypernetwork and was inert while this defaulted to a single layer.
hypernet_layers: 2
# Ordered fixed slots, sized to the training pool (N_R, N_B, K). B0 therefore
# has no parameters for a larger roster and is not evaluated outside the pool.
pool_slots: [10, 10, 3]
obs_agent_id: false
obs_last_action: false
popart: false
max_traj_len: -1
t_max: 0
name: b0_qmix
mac: entity_mac
learner: q_learner
mixer: qmix
encoder: flatten
entity_last_action: false
# Reference PyMARL uses abs(), whose unbounded hypernet weights let Q_tot chase
# its own bootstrap on this 45-step task (v3 round 1 reached q_tot +622). ALMA's
# softmax option, already used by B2 and REFIL, bounds each weight row to sum 1;
# sharing it leaves the encoder and mixer architecture as the only B0/B2 difference.
softmax_mixing_weights: true
agent:
  # Reference PyMARL QMIX uses fc-GRUCell-fc; B0 stays ordered and identity-free
  # but is no longer memoryless. See refil.yaml.
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: null

