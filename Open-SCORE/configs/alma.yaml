# ALMA 81bd5c475972b982ce470b1ed78154ec39d236da. The upstream repository does
# not ship an ALMA algorithm yaml; the hierarchy therefore keeps the official
# hier_agent defaults from config/default.yaml, and the low-level controller is
# identical to b2_qmix_atten.yaml so the only difference against that arm is
# the subtask hierarchy itself.
runner: parallel
batch_size_run: 8
buffer_size: 5000
batch_size: 32
training_iters: 8
target_update_interval: 200
alloc_target_update_interval: 50
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
lr: 0.0005
gamma: 0.99
rnn_hidden_dim: 64
encoder_chunk_size: 1024
encoder_skip_dead: true
attn_embed_dim: 128
attn_n_heads: 4
alloc_embed_dim: 128
alloc_n_heads: 4
mixing_embed_dim: 32
mixer_chunk_size: 256
mixer_skip_unfilled: true
hypernet_embed: 128
softmax_mixing_weights: true
obs_agent_id: false
obs_last_action: false
popart: false
max_traj_len: -1
t_max: 0
name: alma
mac: entity_mac
learner: q_learner
mixer: flex_qmix
encoder: attention
entity_last_action: true
# Three spare subtask embeddings. Training pads to 3 target slots while the
# evaluation interface has 6, and this is ALMA's own mechanism for a larger
# subtask set: the one-hot width stays 6 in both, so best.pt still has
# parameters for the K=4/6 extrapolation line.
n_extra_tasks: 3
agent:
  # Same GRU head as the other arms. Subtask masking is ALMA's flagship
  # conditioning and the only one our encoders consume unchanged: it enters
  # through obs_mask before the encoder, whereas 'full_obs' would need a
  # task-embedding input the shared encoders do not read.
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: mask
hier_agent:
  task_allocation: aql
