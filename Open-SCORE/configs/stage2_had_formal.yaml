# Formal Stage-2 protocol. Collect once, then freeze dataset.jsonl for model runs.
seed: 20260831
device: cuda
formal_mode: true
output_dir: outputs/stage2_had_formal
minimum_continuations_per_cell: 32

data:
  # Formal training never recollects. Run stage2_had_formal_collect.yaml first,
  # then copy dataset_sha256 from dataset_manifest.json into expected_sha256.
  source: jsonl
  path: outputs/stage2_had_formal_frozen/dataset.jsonl
  manifest_path: outputs/stage2_had_formal_frozen/dataset_manifest.json
  expected_sha256: REPLACE_WITH_64_HEX_DATASET_SHA256

formal_data_contract:
  required_schema_version: 4
  required_lineage_groups: 140
  required_scales: [[2, 1], [3, 1], [3, 2], [4, 1], [4, 2], [4, 3]]
  required_red_candidate_count: 3
  required_blue_threat_count: 2
  required_continuations_per_cell: 32
  required_nonempty_checkpoint_sha256_count: 1
  required_checkpoint_candidate_count: 1
  expected_stage1_checkpoint_sha256: REPLACE_WITH_64_HEX_STAGE1_CHECKPOINT_SHA256
  required_physical_target_fields:
    - payoff_red
    - target_final_health_fraction
    - target_min_health_fraction
    - defender_survivors
    - attacker_survivors
    - defender_casualties
    - attacker_casualties
    - minimum_threat_distance
    - cumulative_target_damage
    - cumulative_defender_damage
    - cumulative_attacker_damage
    - red_action_cost
    - blue_action_cost
  require_complete_physical_targets: true
  require_strict_red_superiority: true
  required_snapshot_steps: [0, 10, 20]
  required_planned_snapshot_roots: 2520
  required_snapshot_zero_roots: 840
  require_snapshot_zero_for_every_lineage_scale: true

split:
  train_fraction: 0.45
  validation_fraction: 0.15
  temperature_calibration_fraction: 0.10
  risk_calibration_fraction: 0.15
  stratify_by_scenario: false

training:
  model_kind: had_deepset
  horizon_bins: 6
  steps_per_bin: 5
  hidden_dim: 96
  ensemble_members: 5
  epochs: 160
  minimum_epochs: 30
  early_stopping_patience: 20
  batch_size: 256
  learning_rate: 0.0007
  weight_decay: 0.00001
  gradient_clip: 5.0
  calibration_alpha: 0.10
  require_conformal_guarantee: true
  include_policy_context: true
  policy_unknown_augmentation_probability: 0.10
  # Joint train-only-z-scored heads for the 13 physical/count indicators.
  physical_loss_weight: 0.50
  physical_interval_lower_quantile: 0.10
  physical_interval_upper_quantile: 0.90

evaluation:
  bootstrap_samples: 2000
  bootstrap_seed: 20269831

tabular_baseline:
  enabled: true
  max_iter_candidates: [50, 100, 200]
  learning_rate: 0.08
  max_leaf_nodes: 31
  l2_regularization: 1.0

# Frozen before the one-shot Test split is opened.  The 13 entries correspond
# one-for-one to section 15.7 of the unique experiment protocol.
acceptance:
  protocol: OpenSCORE-Stage2-Acceptance-v1
  required_gate_count: 13
  gates:
    S2-01:
      name: breach_climatology_brier_skill
      metric: test_metrics.breach.climatology_brier_skill
      operator: ">"
      value: 0.0
    S2-02:
      name: outperform_hist_gradient_boosting
      brier_operator: "<"
      auc_operator: ">="
      comparator: strong_tabular_baseline
    S2-03:
      name: outperform_train_empirical_joint_baseline
      joint_nll_operator: "<"
      integrated_breach_brier_operator: "<"
      comparator: test_metrics.empirical_joint_train_frequency_baseline
    S2-04:
      name: event_time_mae_improvement_over_median
      metric: test_metrics.remaining_time.event_time_mae_improvement_over_median
      operator: ">"
      value: 0.0
    S2-05:
      name: candidate_rate_coverage
      metric: test_metrics.calibrated_risk_bound.candidate_rate_coverage
      operator: ">="
      value: 0.90
    S2-06:
      name: post_selection_coverage
      metric: test_metrics.red_candidate_decision.post_selection_coverage
      operator: ">="
      value: 0.90
    S2-07:
      name: useful_risk_bound_width
      mean_upper_bound_operator: "<"
      mean_upper_bound_value: 0.95
      mean_interval_width_operator: "<="
      mean_interval_width_value: 0.30
    S2-08:
      name: red_regret_below_fixed_baselines
      random_comparator_operator: "<"
      fixed_global_best_comparator_operator: "<"
    S2-09:
      name: red_pair_ranking_accuracy
      metric: test_metrics.red_candidate_decision.red_ranking_pair_accuracy
      operator: ">"
      value: 0.50
    S2-10:
      name: physical_heads_evaluated_and_skilled
      required_evaluated_heads: 13
      minimum_positive_mae_skill_heads: 9
      skill_operator: ">"
      skill_value: 0.0
    S2-11:
      name: critical_physical_heads_positive_skill
      fields: [payoff_red, target_final_health_fraction, target_min_health_fraction, defender_casualties, attacker_casualties]
      operator: ">"
      value: 0.0
    S2-12:
      name: constrained_physical_predictions_in_range
      fields: [target_final_health_fraction, target_min_health_fraction, defender_survivors, attacker_survivors, defender_casualties, attacker_casualties, minimum_threat_distance, cumulative_target_damage, cumulative_defender_damage, cumulative_attacker_damage, red_action_cost, blue_action_cost]
      operator: "=="
      value: 1.0
    S2-13:
      name: roster_redundancy_identity
      sides: [defender, attacker]
      operator: "<="
      value_agents: 0.10
