[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-score"
version = "4.0.0"
description = "Known-opponent dynamic grouping with common rule execution and continuation evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.11.4",
  "torch>=2.0",
  "PyYAML>=6.0",
  "pygame>=2.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[project.scripts]
open-score = "open_score.grouping.cli:main"
open-score-v4 = "open_score.research_v4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
HAD_Env = ["resources/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
