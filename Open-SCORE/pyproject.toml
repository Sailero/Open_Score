[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-score"
version = "0.1.0"
description = "Four-stage open-population attack-defense research scaffold"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.11.4",
  "torch>=1.13",
  "PyYAML>=6.0",
  "pygame>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
HAD_Env = ["resources/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
