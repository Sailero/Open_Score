[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-score"
version = "0.1.0"
description = "Four-stage open-population attack-defense research scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.11.4",
  "torch>=1.13",
  "PyYAML>=6.0",
  "pygame>=2.5",
  "psutil>=5.9",
]

[project.optional-dependencies]
stage2 = [
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]
test = [
  "pytest==8.4.2",
]

[project.scripts]
open-score-stage3-view = "open_score.stage3.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
HAD_Env = ["resources/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
