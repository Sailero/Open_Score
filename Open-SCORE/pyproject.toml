[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-score"
version = "6.4.0"
description = "HAD damage-defense environments, rules, and cross-scale MARL experiments"
requires-python = ">=3.10"
dependencies = [
  "had-env @ git+https://github.com/Sailero/SkyHAD.git@9e25a1c3e32cba31f00c0a42bd2c1e58988afaa2",
]

[project.optional-dependencies]
training = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.9",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "psutil>=5.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["open_score*"]

[tool.setuptools.package-data]
"open_score.algos.pymarl" = ["LICENSE", "README.md", "config/default.yaml"]
"open_score.algos.dcg_patch" = ["LICENSE"]
