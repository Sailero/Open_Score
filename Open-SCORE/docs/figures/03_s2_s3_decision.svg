<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#3e4a5d"/></marker>
    <style>.t{font:700 27px Arial;fill:#18212f}.s{font:400 15px Arial;fill:#526071}.h{font:700 18px Arial;fill:#18212f}.b{font:400 14px Arial;fill:#354254}.x{font:400 12px Arial;fill:#526071}.box{stroke:#98a5b4;stroke-width:1.4;rx:11}.arr{stroke:#3e4a5d;stroke-width:2;fill:none;marker-end:url(#ar)}.cell{font:600 13px Arial;fill:#283548}</style>
  </defs>
  <rect width="1440" height="780" fill="white"/>
  <text x="50" y="47" class="t">From local forecasts to an auditable online grouping game</text>
  <text x="50" y="74" class="s">S2 estimates a policy-conditioned local matchup; S3 uses opponent context and restricted columns to choose a robust global allocation.</text>

  <rect x="45" y="120" width="250" height="520" class="box" fill="#f3f5f8"/>
  <text x="67" y="155" class="h">Inputs at command time</text>
  <text x="67" y="195" class="b">global state and alive IDs</text>
  <text x="67" y="224" class="b">M targets and previous grouping</text>
  <text x="67" y="253" class="b">S1 version + opponent context bₖ</text>
  <line x1="68" y1="280" x2="272" y2="280" stroke="#b7c0ca"/>
  <text x="67" y="316" class="h">Restricted allocation columns</text>
  <text x="67" y="350" class="b">defense rows: zD¹ … zDᴷ</text>
  <text x="67" y="379" class="b">attack columns: zA¹ … zAᴸ</text>
  <text x="67" y="408" class="b">each target receives 0–4 units</text>
  <text x="67" y="437" class="b">unassigned units may stay reserve</text>
  <rect x="68" y="480" width="204" height="112" rx="8" fill="#fff" stroke="#b7c0ca"/>
  <text x="84" y="509" class="x">Example counts over 3 targets</text>
  <text x="84" y="540" class="cell">zD = [2, 1, 1 | 0 reserve]</text>
  <text x="84" y="569" class="cell">zA = [1, 2, 0 | 1 reserve]</text>

  <rect x="345" y="120" width="300" height="520" class="box" fill="#eef8f4"/>
  <text x="367" y="155" class="h">S2: strategy-conditioned model</text>
  <text x="367" y="193" class="b">For each (zD, zA, target):</text>
  <rect x="375" y="220" width="240" height="86" rx="8" fill="#fff" stroke="#72a78f"/>
  <text x="393" y="249" class="b">canonical state + policy context</text>
  <text x="393" y="276" class="x">≤ 4 defenders, ≤ 4 attackers</text>
  <path d="M495 307 V337" class="arr"/>
  <rect x="375" y="344" width="240" height="78" rx="8" fill="#fff" stroke="#72a78f"/>
  <text x="393" y="374" class="b">5 bootstrap MLPs</text>
  <text x="393" y="399" class="x">joint categorical outcome × time</text>
  <path d="M495 423 V453" class="arr"/>
  <rect x="375" y="460" width="240" height="142" rx="8" fill="#fff" stroke="#72a78f"/>
  <text x="393" y="489" class="cell">p(defense success)</text>
  <text x="393" y="516" class="cell">p(breach within Hc)</text>
  <text x="393" y="543" class="cell">E[remaining steps]</text>
  <text x="393" y="570" class="cell">ensemble disagreement</text>
  <text x="393" y="592" class="x">one-sided bound calibrated by roots</text>

  <rect x="695" y="120" width="330" height="520" class="box" fill="#fff5ea"/>
  <text x="717" y="155" class="h">S3: robust macro Q</text>
  <text x="717" y="191" class="b">One matrix cell for each grouping pair:</text>
  <rect x="730" y="220" width="260" height="95" rx="8" fill="#fff" stroke="#d49a53"/>
  <text x="750" y="249" class="cell">Qij = 1 − calibrated risk</text>
  <text x="750" y="276" class="b">− λT early-breach pressure</text>
  <text x="750" y="300" class="b">− λsw switch + future value</text>
  <text x="717" y="354" class="x">Rows: defender allocations · Columns: attacker allocations</text>
  <rect x="748" y="379" width="228" height="157" fill="#fff" stroke="#9aa7b6"/>
  <line x1="804" y1="379" x2="804" y2="536" stroke="#9aa7b6"/><line x1="861" y1="379" x2="861" y2="536" stroke="#9aa7b6"/><line x1="918" y1="379" x2="918" y2="536" stroke="#9aa7b6"/>
  <line x1="748" y1="418" x2="976" y2="418" stroke="#9aa7b6"/><line x1="748" y1="457" x2="976" y2="457" stroke="#9aa7b6"/><line x1="748" y1="496" x2="976" y2="496" stroke="#9aa7b6"/>
  <text x="768" y="405" class="x">zA1</text><text x="825" y="405" class="x">zA2</text><text x="882" y="405" class="x">zA3</text><text x="936" y="405" class="x">…</text>
  <text x="758" y="444" class="x">zD1</text><text x="818" y="444" class="cell">.61</text><text x="875" y="444" class="cell">.32</text><text x="930" y="444" class="cell">.45</text>
  <text x="758" y="483" class="x">zD2</text><text x="818" y="483" class="cell">.47</text><text x="875" y="483" class="cell">.55</text><text x="930" y="483" class="cell">.38</text>
  <text x="758" y="522" class="x">…</text>
  <text x="717" y="580" class="b">Opponent ambiguity set Y(bₖ) + S4 residual</text>

  <rect x="1075" y="120" width="320" height="520" class="box" fill="#eef6fb"/>
  <text x="1097" y="155" class="h">Maximin decision and trace</text>
  <rect x="1110" y="205" width="250" height="78" rx="8" fill="#fff" stroke="#87a9c3"/>
  <text x="1128" y="235" class="cell">x* = arg maxₓ minᵧ∈Y(bₖ) xᵀQy</text>
  <text x="1128" y="260" class="x">restricted LP + bilateral BR oracles</text>
  <path d="M1235 284 V316" class="arr"/>
  <rect x="1110" y="323" width="250" height="203" rx="8" fill="#fff" stroke="#87a9c3"/>
  <text x="1128" y="353" class="b">defender allocation mixture x*</text>
  <text x="1128" y="383" class="b">worst robust attack response</text>
  <text x="1128" y="413" class="b">sampled count allocation</text>
  <text x="1128" y="443" class="b">ID-to-group assignment</text>
  <text x="1128" y="473" class="b">risk / column gap / latency trace</text>
  <text x="1128" y="505" class="x">execute for Hc steps, then replan</text>
  <text x="1097" y="575" class="h">Primary evidence</text>
  <text x="1097" y="603" class="b">closed-loop success and decision regret</text>

  <path d="M295 380 H335" class="arr"/><path d="M645 380 H685" class="arr"/><path d="M1025 380 H1065" class="arr"/>
  <text x="50" y="704" class="s">The point predictor is not the commander: uncertainty, the attacker's simultaneous grouping choice, and regrouping cost are what turn forecasts into a decision problem.</text>
</svg>
