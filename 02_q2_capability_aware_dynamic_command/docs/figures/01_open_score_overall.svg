<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b4556"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#18212f}.sub{font:400 15px Arial,sans-serif;fill:#526071}
      .stage{font:700 19px Arial,sans-serif;fill:#17202d}.head{font:700 15px Arial,sans-serif;fill:#17202d}
      .body{font:400 14px Arial,sans-serif;fill:#354254}.tiny{font:400 12px Arial,sans-serif;fill:#526071}
      .box{stroke:#9aa7b6;stroke-width:1.4;rx:12}.flow{fill:none;stroke:#3b4556;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#6d7787;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="800" fill="#ffffff"/>
  <text x="55" y="48" class="title">Open-SCORE: composing reusable small games for open-population defense</text>
  <text x="55" y="75" class="sub">Population losses/reinforcements trigger regrouping; low-level policies still output acceleration only.</text>

  <rect x="45" y="115" width="190" height="385" class="box" fill="#f3f5f8"/>
  <text x="65" y="150" class="stage">Global scene</text>
  <text x="65" y="178" class="body">Multiple protected targets</text>
  <circle cx="95" cy="225" r="11" fill="#e89b42"/><circle cx="165" cy="260" r="11" fill="#e89b42"/>
  <path d="M72 318 l10 -15 l10 15 z" fill="#2d6a9f"/><path d="M112 335 l10 -15 l10 15 z" fill="#2d6a9f"/>
  <path d="M172 330 l10 -15 l10 15 z" fill="#2d6a9f"/><circle cx="83" cy="382" r="9" fill="#c94f4f"/>
  <circle cx="128" cy="400" r="9" fill="#c94f4f"/><circle cx="182" cy="385" r="9" fill="#c94f4f"/>
  <text x="65" y="438" class="body">Deaths / reinforcements</text>
  <text x="65" y="463" class="body">change both teams online</text>

  <rect x="285" y="115" width="250" height="385" class="box" fill="#eef6fb"/>
  <text x="305" y="150" class="stage">S1 · Small-game executor</text>
  <rect x="310" y="178" width="200" height="78" rx="8" fill="#ffffff" stroke="#87a9c3"/>
  <text x="326" y="205" class="head">One random target</text>
  <text x="326" y="230" class="body">1–4 defenders vs 1–4 attackers</text>
  <text x="305" y="290" class="body">Two variable-scale QMIX teams</text>
  <text x="305" y="318" class="body">27 quantized acceleration vectors</text>
  <text x="305" y="346" class="body">Small PSRO after warm start</text>
  <rect x="310" y="380" width="200" height="82" rx="8" fill="#dcecf7" stroke="#87a9c3"/>
  <text x="326" y="408" class="head">Reusable capability library</text>
  <text x="326" y="434" class="tiny">team policy populations + meta-policy</text>

  <rect x="585" y="115" width="250" height="385" class="box" fill="#eef8f4"/>
  <text x="605" y="150" class="stage">S2 · Outcome predictor</text>
  <text x="605" y="187" class="body">Canonical padded local state</text>
  <text x="605" y="215" class="body">Small bootstrap MLP ensemble</text>
  <rect x="610" y="252" width="200" height="154" rx="8" fill="#ffffff" stroke="#72a78f"/>
  <text x="626" y="280" class="head">Joint outcome–time distribution</text>
  <text x="626" y="312" class="body">defense success probability</text>
  <text x="626" y="340" class="body">near-term breach probability</text>
  <text x="626" y="368" class="body">expected remaining steps</text>
  <text x="626" y="396" class="body">empirical 95% model interval</text>
  <text x="605" y="451" class="tiny">No attention model unless the MLP fails.</text>

  <rect x="885" y="115" width="300" height="385" class="box" fill="#fff5ea"/>
  <text x="905" y="150" class="stage">S3 · Grouping game</text>
  <text x="905" y="184" class="body">Enumerate both teams' count allocations</text>
  <text x="905" y="212" class="body">Query S2 for each allocation pair</text>
  <rect x="910" y="245" width="250" height="105" rx="8" fill="#ffffff" stroke="#d49a53"/>
  <text x="928" y="274" class="head">Conservative payoff matrix U</text>
  <text x="928" y="302" class="body">breach upper bound + time pressure</text>
  <text x="928" y="328" class="body">+ regrouping cost</text>
  <text x="905" y="390" class="body">Solve  maxₓ minⱼ  xᵀU[:,j]  by LP</text>
  <text x="905" y="425" class="head">Output</text>
  <text x="905" y="452" class="body">mixed allocation + worst response</text>
  <text x="905" y="477" class="body">+ auditable decision diagnostics</text>

  <rect x="1235" y="115" width="165" height="385" class="box" fill="#f3f5f8"/>
  <text x="1255" y="150" class="stage">Execute</text>
  <text x="1255" y="188" class="body">Assign IDs to groups</text>
  <text x="1255" y="216" class="body">Run S1 policies</text>
  <text x="1255" y="244" class="body">for Hc steps</text>
  <path d="M1275 304 l18 -27 l18 27 z" fill="#2d6a9f"/><circle cx="1340" cy="292" r="13" fill="#c94f4f"/>
  <circle cx="1310" cy="365" r="15" fill="#e89b42"/>
  <text x="1255" y="420" class="head">Replan when</text>
  <text x="1255" y="447" class="body">event / risk / Hc</text>

  <path d="M235 307 H275" class="flow"/><path d="M535 307 H575" class="flow"/>
  <path d="M835 307 H875" class="flow"/><path d="M1185 307 H1225" class="flow"/>

  <rect x="285" y="565" width="900" height="155" class="box" fill="#f6f1fb" stroke="#9d83b8"/>
  <text x="310" y="600" class="stage">S4 · Final-outcome co-adaptation</text>
  <text x="310" y="632" class="body">Learn a bounded global residual:  δψ(global state, both allocations) ≈ final outcome − S2 payoff</text>
  <text x="310" y="662" class="body">Re-solve S3 → train new S1 PSRO best responses under commanded assignments → refresh S2</text>
  <text x="310" y="692" class="body">Accept a new joint version only when held-out scale/opponent guards pass; otherwise roll back.</text>
  <path d="M1317 500 V642 H1198" class="dash"/>
  <path d="M885 643 H846 V512 H710" class="dash"/>
  <path d="M585 675 H410 V512" class="dash"/>
  <text x="1195" y="633" class="tiny">final episode outcome</text>
</svg>
