# Shared PURE/HAD defaults, including the retained ALMA/PyMARL defaults.
# Provenance: ALMA 81bd5c475972b982ce470b1ed78154ec39d236da (MIT;
# see algos/common/pymarl/LICENSE). The project adaptations are explicit below.
# Inheritance: `extends` names YAML files relative to the child. Parents merge
# left to right, then the child: mappings merge recursively; scalars, lists,
# and null replace the old value. Runtime overrides apply the same rule last.
# No vendor YAML or Python hyperparameter override is applied after this file.
# t_max=0 leaves the physical-step budget unselected; training requires an
# explicit positive budget. These defaults are editable, including 8/8/32/5000.
runner: parallel
mac: entity_mac
env: had
env_args:
  train_dist: mixed_le10
  max_steps: 100
  blue_upper: reactive
  blue_lower: rush
  target_initialization: random
  spatial_dim: 2
batch_size_run: 8
test_nepisode: 20
test_interval: 2000
test_greedy: true
log_interval: 2000
runner_log_interval: 2000
learner_log_interval: 1000
t_max: 0
use_cuda: true
buffer_cpu_only: true
buffer_opt_mem: true
multi_task: false
use_tensorboard: false
save_model: false
save_model_interval: 5000
checkpoint_run_name: ''
pi_checkpoint_run_name: ''
checkpoint_unique_id: ''
evaluate: false
load_step: 0
save_replay: false
video_path: null
fps: 2
tb_dirname: tb_logs
eval_all_models: false
eval_all_scen: false
eval_sep: false
eval_n_task_range: ''
eval_path: null
gamma: 0.99
batch_size: 32
max_traj_len: -1
buffer_size: 5000
lr: 0.0005
optim_alpha: 0.99
optim_eps: 1.0e-05
grad_norm_clip: 10
weight_decay: 0
alloc_q_weight_decay: 0
target_update_interval: 200
alloc_target_update_interval: 50
popart: false
n_extra_units: 0
n_extra_tasks: 0
vi_lambda: 5.0e-05
agent:
  recurrent: true
  entity_scheme: true
  imagine: false
  subtask_cond: null
hier_agent:
  task_allocation: null
  copa: false
  mask_copa: true
  copa_vi_loss: true
  action_length: 5
  alloc_critic: standard
  alloc_policy: autoreg
  decay_old: 150000
  n_proposals: 32
  alloc_eps: 1.0-0.0-0.05
  prop_alloc_eps: 1.0-0.05-0.2
  entropy_loss: 0.01
  alloc_opt: rmsprop
  max_bs: 400
  pi_ag_attn: false
  subtask_mask: true
  sel_task_upd: true
  pi_pointer_net: true
  pi_autoreg: true
mask_subtask_actions: false
rnn_hidden_dim: 64
attn_embed_dim: 128
attn_n_heads: 4
alloc_embed_dim: 128
alloc_n_heads: 4
obs_agent_id: false
obs_last_action: false
softmax_mixing_weights: false
mixer_subtask_cond: null
training_iters: 8
seed: 0
entity_scheme: true
feature_layout: had
entity_pad: train
report_interval: 300
progress_interval: 10
resume_interval: 600
resume: false
run: train
output: outputs
shaping_coef: 1.0
shaping_range: 4000.0
reward_mode: damage
friendly_penalty: 1.0
implementation_revision: train_pool_pad_eval_ceiling
skip_final_eval: true
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
agent_output_type: q
double_q: true
optimizer: rmsprop
encoder: attention
encoder_chunk_size: 1024
encoder_skip_dead: true
mixing_embed_dim: 32
mixer_chunk_size: 256
mixer_skip_unfilled: true
hypernet_embed: 128
entity_last_action: true
imagine_group: original
count_cond: null
count_ln: true
global_branch: null
global_slots: 4
global_depths:
- 1
- 2
- 3
- 4
global_eval_depth: 4
global_embed_dim: 64
global_ffn_mult: 2
global_n_heads: 4
global_feedback_mode: gru
skip_refil_local: false
skip_count_inject: false
read_last_round: false
rer_update: tied
rer_readout: learned
matched_hidden: 0
